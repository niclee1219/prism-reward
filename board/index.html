<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <title>PRISM Run · Leaderboard</title>
  </head>
  <body class="board-page">
    <main class="board">
      <section class="board-left">
        <header>
          <h1>PRISM<span>RUN</span></h1>
          <div class="status" id="status">connecting...</div>
        </header>
        <div class="king-banner" id="king" hidden>
          <div class="king-label">👑 KING OF THE HILL</div>
          <div class="king-name" id="king-name"></div>
        </div>
        <ol class="rows" id="rows"></ol>
        <p class="empty" id="empty">No scores yet. Be the first!</p>
      </section>
      <aside class="board-right">
        <div class="qr-box"><canvas id="qr"></canvas></div>
        <div class="scan">SCAN TO PLAY</div>
        <div class="tag">Talk to your code.<br />Understand it in minutes.</div>
        <div class="plays"><b id="plays">0</b><span>plays so far</span></div>
      </aside>
    </main>
    <script type="module" src="/src/board/board.ts"></script>
  </body>
</html>
