<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1b1b2f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <title>PRISM Run</title>
  </head>
  <body class="game-page">
    <div id="stage">
      <div id="game"></div>

      <div id="hud" hidden>
        <div class="hud-top">
          <div class="hud-score" id="hud-score">0</div>
          <div class="hud-chips">
            <span class="chip chip-shield" id="hud-shield" hidden>◆ SHIELD</span>
            <span class="chip chip-mult" id="hud-mult" hidden>x2</span>
          </div>
        </div>
        <div class="hud-bar"><i id="hud-progress"></i></div>
        <div class="qpanel" id="qpanel" hidden>
          <div class="q-text" id="q-text"></div>
          <div class="q-answers">
            <div class="q-card lane0"></div>
            <div class="q-card lane1"></div>
            <div class="q-card lane2"></div>
          </div>
        </div>
      </div>

      <section id="screen-start" class="screen">
        <div class="logo">
          <div class="logo-prism" aria-hidden="true"></div>
          <h1>PRISM<span>RUN</span></h1>
        </div>
        <p class="backdrop">You've just inherited the hawker queue app.<br />No docs. Good luck.</p>
        <label class="nick">
          <span class="sr">Nickname</span>
          <input id="nickname" maxlength="16" autocomplete="off" autocapitalize="words" spellcheck="false" />
          <button type="button" id="reroll" aria-label="Suggest another nickname">🎲</button>
        </label>
        <button type="button" id="play" class="btn btn-big">PLAY</button>
      </section>

      <section id="screen-results" class="screen" hidden></section>
    </div>
    <div id="rotate"><div>📱<br />Turn your phone upright to play</div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
