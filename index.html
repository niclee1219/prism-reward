<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1b1b2f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <title>PRISM Run: Ah Ma's Recipe</title>
  </head>
  <body class="game-page">
    <div id="stage">
      <div id="game"></div>

      <div id="hud" hidden>
        <div class="hud-top">
          <div class="hud-left">
            <div class="hud-score" id="hud-score">0</div>
            <span class="chip chip-coins" id="hud-coins"><i class="coin"></i><b id="hud-coin-n">0</b></span>
          </div>
          <div class="hud-chips">
            <span class="chip chip-power" id="hud-power" hidden><b id="hud-power-label"></b><i id="hud-power-bar"></i></span>
            <span class="chip chip-shield" id="hud-shield" hidden>◆ SHIELD</span>
            <span class="chip chip-mult" id="hud-mult" hidden>x2</span>
          </div>
        </div>
        <div class="hud-recipe-row">
          <span class="hud-dish" id="hud-dish"></span>
          <div class="hud-recipe" id="hud-recipe" aria-label="Recipe steps recovered"></div>
        </div>
        <div class="hud-bar"><i id="hud-progress"></i></div>
        <div class="qpanel" id="qpanel" hidden>
          <div class="q-text" id="q-text"></div>
          <div class="q-answers">
            <div class="q-card lane0"></div>
            <div class="q-card lane1"></div>
            <div class="q-card lane2"></div>
          </div>
        </div>
      </div>

      <section id="screen-start" class="screen">
        <div class="logo">
          <svg class="logo-mark pix-crisp" viewBox="0 0 60 18" shape-rendering="crispEdges" aria-hidden="true"><path fill="#2a1608" d="M30 0h1v1h-1zM30 1h1v1h-1zM29 2h1v1h-1zM31 2h1v1h-1zM29 3h1v1h-1zM31 3h1v1h-1zM28 4h1v1h-1zM32 4h1v1h-1zM27 5h1v1h-1zM33 5h1v1h-1zM26 6h1v1h-1zM34 6h1v1h-1zM26 7h1v1h-1zM34 7h1v1h-1zM25 8h1v1h-1zM35 8h1v1h-1zM24 9h1v1h-1zM36 9h1v1h-1zM23 10h1v1h-1zM37 10h1v1h-1zM23 11h1v1h-1zM37 11h1v1h-1zM22 12h1v1h-1zM38 12h1v1h-1zM21 13h1v1h-1zM39 13h1v1h-1zM20 14h1v1h-1zM40 14h1v1h-1zM20 15h1v1h-1zM40 15h1v1h-1zM19 16h23v1h-23z"/><path fill="#e63946" d="M58 1h2v1h-2zM54 2h6v1h-6zM51 3h9v1h-9zM47 4h7v1h-7zM57 4h1v1h-1zM44 5h7v1h-7zM41 6h6v1h-6zM37 7h4v1h-4zM36 8h1v1h-1z"/><path fill="#ffffff" d="M30 2h1v1h-1zM30 3h1v1h-1zM29 4h2v1h-2zM28 5h2v1h-2zM27 6h2v1h-2zM27 7h2v1h-2zM26 8h2v1h-2zM25 9h2v1h-2zM18 10h5v1h-5zM24 10h2v1h-2zM7 11h11v1h-11zM24 11h2v1h-2zM0 12h7v1h-7zM23 12h2v1h-2zM22 13h2v1h-2zM21 14h2v1h-2zM21 15h2v1h-2z"/><path fill="#7fc8ef" d="M31 4h1v1h-1zM30 5h3v1h-3zM31 6h3v1h-3zM31 7h3v1h-3zM32 8h3v1h-3zM33 9h3v1h-3zM34 10h3v1h-3zM34 11h3v1h-3zM35 12h3v1h-3zM36 13h3v1h-3zM37 14h3v1h-3zM37 15h3v1h-3z"/><path fill="#ff9f1c" d="M54 4h3v1h-3zM58 4h2v1h-2zM51 5h9v1h-9zM47 6h7v1h-7zM57 6h1v1h-1zM41 7h6v1h-6zM38 8h3v1h-3z"/><path fill="#bfe9ff" d="M29 6h2v1h-2zM29 7h2v1h-2zM28 8h4v1h-4zM27 9h6v1h-6zM26 10h8v1h-8zM26 11h8v1h-8zM25 12h10v1h-10zM24 13h12v1h-12zM23 14h14v1h-14zM23 15h14v1h-14z"/><path fill="#ffd166" d="M54 6h3v1h-3zM58 6h2v1h-2zM47 7h13v1h-13zM37 8h1v1h-1zM41 8h6v1h-6zM48 8h3v1h-3zM52 8h2v1h-2zM57 8h1v1h-1z"/><path fill="#52e08a" d="M47 8h1v1h-1zM51 8h1v1h-1zM54 8h3v1h-3zM58 8h2v1h-2zM38 9h22v1h-22zM52 10h2v1h-2zM57 10h3v1h-3z"/><path fill="#4cc9f0" d="M37 9h1v1h-1zM38 10h14v1h-14zM54 10h3v1h-3zM48 11h12v1h-12zM52 12h2v1h-2zM57 12h3v1h-3z"/><path fill="#cfe9ff" d="M18 11h5v1h-5zM7 12h11v1h-11zM3 13h4v1h-4z"/><path fill="#b388ff" d="M43 11h5v1h-5zM48 12h4v1h-4zM54 12h3v1h-3zM52 13h8v1h-8zM57 14h3v1h-3z"/></svg>
          <h1 class="pix-title" aria-label="PRISM RUN"><b>P</b><b>R</b><b>I</b><b>S</b><b>M</b><span><b>R</b><b>U</b><b>N</b></span></h1>
          <div class="logo-sub">AH MA'S RECIPE</div>
        </div>
        <p class="backdrop pix-panel pix-panel--night">
          Ah Ma left you her hawker stall, and her secret recipe.<br />
          Her notes say things like <em>"cook until it smells right"</em>.<br />
          Like code with no docs. Use <b>PRISM</b> to decode all 8 steps before the lunch rush.
        </p>
        <div class="dishes" id="dishes" role="group" aria-label="Choose your dish"></div>
        <p class="dish-blurb" id="dish-blurb"></p>
        <label class="nick" id="nick-row">
          <span class="sr">Your name</span>
          <input id="nickname" maxlength="16" placeholder="Type your name" autocomplete="off" autocapitalize="words" spellcheck="false" />
          <button type="button" id="reroll" class="pix-btn pix-btn--cream" aria-label="Pick a random name">🎲</button>
        </label>
        <p class="nick-locked pix-panel pix-panel--night" id="nick-locked" hidden>Playing as <b id="nick-locked-name"></b></p>
        <p class="nick-error" id="nick-error" role="alert" hidden></p>
        <button type="button" id="play" class="pix-btn btn btn-big"><span>PLAY</span></button>
        <div class="start-links">
          <button type="button" id="open-board" class="pix-btn pix-btn--cream link-btn">🏆 LEADERBOARD</button>
          <button type="button" id="open-howto" class="pix-btn pix-btn--cream link-btn">❓ HOW TO PLAY</button>
          <button type="button" id="open-learn" class="pix-btn pix-btn--cream link-btn learn-link">📖 LEARN HOW PRISM WORKS</button>
        </div>
      </section>

      <section id="screen-results" class="screen" hidden></section>
      <section id="screen-board" class="screen overlay" hidden></section>
      <section id="screen-howto" class="screen overlay" hidden></section>
      <section id="screen-learn" hidden></section>
      <section id="screen-closed" class="screen closed" hidden></section>
    </div>
    <div id="rotate"><div class="rotate-box pix-panel pix-panel--night"><i class="rotate-icon" aria-hidden="true">📱</i><b>TURN ME UPRIGHT</b><span>Hold your phone upright to play</span></div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
